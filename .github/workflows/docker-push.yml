name: docker-push.yml
on:
  push:
    branches: [ pub ]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse Kotlin version
        run: echo "KT_VERSION=$(awk '{ if ($1 == "kotlin") { gsub(/"/, "", $2); print $2; } }' FS=' = ' ./gradle/libs.versions.toml)" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            KOTLIN_VERSION=${{ env.KT_VERSION }}
          tags: |
            z4kn4fein/kt-comp-srv:${{ github.run_id }}
            z4kn4fein/kt-comp-srv:latest
